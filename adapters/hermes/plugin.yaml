name: deep-horizon
description: >-
  Deep Horizon: a deterministic, human-authored horizon (open gaps + session
  log) shared across agent harnesses. Registers a persistent system-prompt
  section composed by `horizon-inject --harness hermes` (the CLI is the single
  composer; this plugin never contains the section-10 texts itself) and closes
  sessions with `horizon session-end --harness hermes`. Fails open when the
  horizon binary is not installed: sessions proceed with no injected horizon.
version: 0.2.0
author: Andre Pontes Melo
# The close hook register() actually subscribes to. `hermes plugins doctor`
# warns when a registered hook is not declared here; keep the two in step
# (test 66 asserts this list equals what register() subscribes).
provides_hooks:
  - on_session_finalize
  - pre_llm_call
